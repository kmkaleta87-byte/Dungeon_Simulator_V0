<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play Dungeon Simulation, a dungeon adventure in development.">
  <meta name="theme-color" content="#e9e5d9">
  <title>Dungeon Simulation</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header" id="top">
    <a class="wordmark" href="#top">Dungeon <span>Simulation</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="#game">Play</a>
      <a href="Images/ART_ASSET_CHECKLIST.txt">Art checklist</a>
      <span class="nav-status">In development</span>
    </nav>
  </header>

  <main id="main">
    <section class="game-shell" id="game" aria-label="Dungeon Simulation game">
      <div class="game-topbar">
        <div><span class="eyebrow">Browser build</span><h1>Dungeon Simulation</h1></div>
        <div class="game-topbar-actions">
          <button class="inventory-button" id="inventory-button" type="button" hidden>Inventory <span></span></button>
          <button class="quiet-button" id="menu-button" type="button" hidden>Return to title</button>
        </div>
      </div>
      <div id="game-screen" aria-live="polite"></div>
    </section>

    <section class="art-note" aria-label="About the art archive">
      <p>Art still in progress? The game calls out the item name anywhere its sprite is missing.</p>
      <a href="Images/ART_ASSET_CHECKLIST.txt">Open the art checklist <span aria-hidden="true">↗</span></a>
    </section>
  </main>

  <footer class="site-footer">
    <a href="#top">Dungeon Simulation</a>
    <span>In development</span>
  </footer>
</body>
</html>
