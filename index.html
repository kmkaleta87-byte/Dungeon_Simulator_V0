<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play Dungeon Simulation, a turn-based dungeon adventure.">
  <meta name="theme-color" content="#e9e5d9">
  <title>Dungeon Simulation</title>
  <link rel="stylesheet" href="style.css">
  <script src="game-index-data.js"></script>
  <script src="game-rules.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header" id="top">
    <a class="wordmark" href="#top">Dungeon <span>Simulation</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="#game">Play</a>
    </nav>
  </header>

  <main id="main">
    <section class="game-shell" id="game" aria-label="Dungeon Simulation game">
      <div class="game-topbar">
        <div><span class="eyebrow">Browser build</span><h1>Dungeon Simulation</h1></div>
        <div class="game-topbar-actions">
          <button class="quiet-button" id="index-button" type="button">Index</button>
          <button class="quiet-button" id="leaderboard-button" type="button">Leaderboard</button>
          <button class="quiet-button" id="menu-button" type="button" hidden>Return to title</button>
        </div>
      </div>
      <div id="game-screen" aria-live="polite"></div>
    </section>

  </main>

  <footer class="site-footer">
    <a href="#top">Dungeon Simulation</a>
    <span>Explore · fight · endure</span>
  </footer>
</body>
</html>
