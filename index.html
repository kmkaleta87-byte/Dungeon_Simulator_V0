<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play Dungeon Simulation, a turn-based dungeon adventure.">
  <meta name="theme-color" content="#e9e5d9">
  <title>Dungeon Simulation</title>
  <link rel="stylesheet" href="style.css">
  <script src="game-index-data.js"></script>
  <script src="weapon-attack-data.js"></script>
  <script src="game-rules.js"></script>
  <script src="leaderboard-config.js"></script>
  <script src="patch-notes.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header" id="top">
    <a class="wordmark" href="#top">Dungeon <span>Simulation</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="#game">Play</a>
      <a href="#patch-notes">Patch Notes</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="main">
    <section class="game-shell" id="game" aria-label="Dungeon Simulation game">
      <div class="game-topbar">
        <div><span class="eyebrow">Browser build</span><h1>Dungeon Simulation</h1></div>
        <div class="game-topbar-actions">
          <button class="quiet-button" id="index-button" type="button">Index</button>
          <button class="quiet-button" id="leaderboard-button" type="button">Leaderboard</button>
          <button class="quiet-button" id="menu-button" type="button" hidden>Return to title</button>
        </div>
      </div>
      <div id="game-screen" aria-live="polite"></div>
    </section>

    <section class="site-section" id="patch-notes" aria-labelledby="patch-title">
      <div class="section-heading"><p class="eyebrow">Development history</p><h2 id="patch-title">Patch Notes</h2></div>
      <div class="patch-layout"><nav class="patch-list" aria-label="Game versions">
        <button class="patch-link active" type="button" data-patch="v1.3" aria-current="true">Update V1.3 <span>Current</span></button>
        <button class="patch-link" type="button" data-patch="v1.2">Update V1.2</button>
        <button class="patch-link" type="button" data-patch="v1.1">Update V1.1</button>
        <button class="patch-link" type="button" data-patch="v1">V1 <span>Release</span></button>
      </nav><article class="patch-content" id="patch-content" aria-live="polite"></article></div>
    </section>

    <section class="site-section about-section" id="about" aria-labelledby="about-title">
      <div class="section-heading"><p class="eyebrow">Creator's note</p><h2 id="about-title">About</h2></div>
      <article class="about-copy" id="about-copy" aria-live="polite"><p>Loading…</p></article>
    </section>

  </main>

  <footer class="site-footer">
    <a href="#top">Dungeon Simulation</a>
    <span>Explore · fight · endure</span>
  </footer>
</body>
</html>
